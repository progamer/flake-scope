name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      # The action runs from its committed bundle, so it must match the sources.
      - name: Check action/dist is up to date
        run: |
          pnpm --filter @codept/flakescope-action run build
          git add --intent-to-add action/dist
          git diff --exit-code action/dist || {
            echo "::error::action/dist is out of date. Run 'pnpm build' and commit action/dist."
            exit 1
          }

  demo:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter demo exec playwright install --with-deps --only-shell chromium
      # The demo is racy on purpose; flaky tests still pass, so this job stays green.
      - run: pnpm demo
      - uses: ./
        if: always()
        with:
          report-path: examples/demo/test-results/flake-report.json
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: flake-report
          path: |
            examples/demo/test-results/flake-report.json
            examples/demo/test-results/**/trace.zip
          retention-days: 14
